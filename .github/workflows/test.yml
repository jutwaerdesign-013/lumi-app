name: KIMPACT browser checks
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application JavaScript syntax
        run: |
          node -e "const fs=require('fs'); const h=fs.readFileSync('index.html','utf8'); const s=h.match(/<script>([\s\S]*?)<\/script>/)[1]; new (require('vm').Script)(s); console.log('Application syntax OK');"
      - run: npm install --no-save @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kimpact-test-results
          path: test-results/
          retention-days: 7
